# How the settings viewer edits configuration.toml (read by DsQt Core).
# Compiled into Dsqt::Core; an application's own configuration.schema.toml is
# layered over it key by key.

[config_folder]
restart = true
description = "Name of a configuration variant (%CFG_FOLDER%): settings files in a subfolder of this name, inside each settings folder, are layered over the others."
